name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      elasticsearch:
        description: "Also run the live Elasticsearch job"
        type: boolean
        default: false

jobs:
  backend:
    name: Backend (lint + unit + integration tests)
    runs-on: ubuntu-latest
    env:
      # Normal CI uses the in-memory BM25 fallback; Elasticsearch is covered by mocked unit tests
      # and by the optional `elasticsearch` job below.
      BM25_BACKEND: memory
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2
      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          python -m spacy download en_core_web_sm
      - name: Ruff format check
        run: ruff format --check app scripts tests
      - name: Ruff lint
        run: ruff check app scripts tests
      - name: Tests (live Elasticsearch test skips without a cluster)
        run: pytest -q -rs

  frontend:
    name: Frontend (typecheck + lint + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npx oxlint src
      - run: npm test
      - run: npm run build

  elasticsearch:
    name: Live Elasticsearch (optional, manual)
    if: github.event_name == 'workflow_dispatch' && inputs.elasticsearch
    runs-on: ubuntu-latest
    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -fs http://localhost:9200/_cluster/health?wait_for_status=yellow"
          --health-interval 10s --health-timeout 10s --health-retries 30
    env:
      ELASTICSEARCH_URL: http://localhost:9200
      REQUIRE_ELASTICSEARCH: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          python -m spacy download en_core_web_sm
      - name: Live Elasticsearch test (must pass, not skip)
        run: pytest -q -rs tests/integration/test_elasticsearch_live.py
      - name: Compare in-memory BM25 with Elasticsearch BM25
        run: python scripts/compare_bm25.py
