[project]
name = "semantic-search-ranking-engine"
version = "0.1.0"
description = "Hybrid BM25 + FAISS document retrieval with XGBoost intent classification and learning-to-rank"
requires-python = ">=3.10,<3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: uses the real sentence-transformer model (downloads it on first run)",
    "elasticsearch: requires a running Elasticsearch at ELASTICSEARCH_URL",
]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "B905"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402", "I001"]
